<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lens</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lens">
<meta name="theme-color" content="#0D1210">
<script>
// Inline web app manifest (so no separate manifest.json file is needed)
(function(){
  var base = function(f){ return new URL(f, location.href).href; };
  var manifest = {
    name: 'Lens', short_name: 'Lens',
    start_url: location.href.split('#')[0], scope: new URL('./', location.href).href,
    display: 'standalone', background_color: '#8EF5B1', theme_color: '#0D1210',
    icons: [
      { src: base('icon-192.png'), sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: base('icon-512.png'), sizes: '512x512', type: 'image/png', purpose: 'any' },
      { src: base('icon-maskable-512.png'), sizes: '512x512', type: 'image/png', purpose: 'maskable' }
    ]
  };
  var link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'}));
  document.head.appendChild(link);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<style>
  :root{
    --bg: #0D1210;
    --surface: #161C19;
    --surface-2: #1E2521;
    --line: #2A332C;
    --text: #EAEFE9;
    --muted: #8FA098;
    --accent: #6FFFA0;
    --accent-dim: #3D8F5C;
    --accent-warm: #FF9B4D;
    --radius: 10px;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1,h2,h3, .display, button, .btn{
    font-family: 'Space Grotesk', sans-serif;
  }

  a{ color: var(--accent); }

  ::selection{ background: var(--accent); color: #08130C; }

  :focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- layout shell ---------- */
  .shell{
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 28px 96px;
  }

  /* ---------- hero ---------- */
  .hero{
    padding: 72px 0 40px;
    display:flex;
    justify-content:center;
  }

  .hero-center{
    width:100%;
    max-width: 560px;
  }

  /* ---------- viewfinder / drop zone ---------- */
  .viewfinder{
    position: relative;
    aspect-ratio: 4/3;
    border-radius: 14px;
    background:
      radial-gradient(circle at 30% 20%, rgba(111,255,160,0.07), transparent 55%),
      var(--surface);
    border: 1px solid var(--line);
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 24px;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
    overflow:hidden;
  }
  .viewfinder.drag-over{
    border-color: var(--accent);
    background: rgba(111,255,160,0.05);
  }
  .viewfinder .corner{
    position:absolute;
    width: 26px; height: 26px;
    border: 2px solid var(--accent-dim);
  }
  .viewfinder:hover .corner{ border-color: var(--accent); }
  .corner.tl{ top:14px; left:14px; border-right:none; border-bottom:none; }
  .corner.tr{ top:14px; right:14px; border-left:none; border-bottom:none; }
  .corner.bl{ bottom:14px; left:14px; border-right:none; border-top:none; }
  .corner.br{ bottom:14px; right:14px; border-left:none; border-top:none; }

  .viewfinder .icon{
    width:44px; height:44px;
    color: var(--accent);
    margin-bottom: 14px;
  }
  .viewfinder h3{
    margin: 0 0 6px;
    font-size: 1.05rem;
    font-weight:600;
  }
  .viewfinder p{
    margin:0;
    color: var(--muted);
    font-size: 0.88rem;
  }

  input[type=file]{ display:none; }

  .upload-actions{
    display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; justify-content:center;
  }

  /* live in-page camera — replaces handing off to the phone's separate
     camera app, so there's no external confirm/retake screen: tapping the
     shutter captures and scans immediately */
  .camera-overlay{
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .camera-overlay.active{ display: flex; }
  .camera-overlay video{
    width: 100%;
    height: 100%;
    object-fit: cover;
    touch-action: none; /* pinch gestures go to the zoom handler below, not page/viewport zoom */
    transform-origin: center center;
  }
  .cam-close{
    position: absolute;
    top: 20px; right: 20px;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.35);
    color: #fff;
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
  }
  .cam-shutter{
    position: absolute;
    bottom: 34px;
    left: 50%;
    transform: translateX(-50%);
    width: 72px; height: 72px;
    border-radius: 50%;
    background: var(--accent);
    border: 4px solid rgba(255,255,255,0.9);
    cursor: pointer;
    transition: transform .08s ease;
  }
  .cam-shutter:active{ transform: translateX(-50%) scale(0.9); }

  /* ---------- current orientation label (top of camera UI) ---------- */
  .cam-mode-label{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 14px;
    border:1px solid rgba(255,255,255,.28);
    border-radius:999px;
    background:rgba(0,0,0,.58);
    color:#fff;
    font:600 12px/1 'Inter',sans-serif;
    letter-spacing:.02em;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    pointer-events:none;
    white-space:nowrap;
    z-index: 5;
  }
  .cam-mode-label svg{
    width:16px;
    height:16px;
    flex:none;
    color: var(--accent);
  }

  /* ---------- portrait-mode toggle button (right of shutter) ---------- */
  .cam-mode-btn{
    position:absolute;
    bottom:34px;
    left:calc(50% + 62px);
    width: 52px; height: 52px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.4);
    color:#fff;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background .15s ease, border-color .15s ease, color .15s ease, transform .08s ease;
  }
  .cam-mode-btn svg{
    width:22px;
    height:22px;
    pointer-events:none;
  }
  .cam-mode-btn:active{ transform: scale(0.9); }
  .cam-mode-btn.active{
    background: var(--accent);
    border-color: var(--accent);
    color: #08130C;
  }

  /* ---------- camera orientation UI ---------- */
  .cam-orientation{
    position:absolute;
    bottom:112px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 11px;
    border:1px solid rgba(255,255,255,.28);
    border-radius:999px;
    background:rgba(0,0,0,.58);
    color:#fff;
    font:600 12px/1 'Inter',sans-serif;
    letter-spacing:.02em;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    pointer-events:none;
    white-space:nowrap;
  }
  .cam-orientation svg{
    width:18px;
    height:18px;
    flex:none;
    transform-origin:50% 50%;
    transition:transform .18s ease;
  }
  .cam-orientation .orientation-text{
    min-width:62px;
    text-align:center;
  }
  .cam-shutter{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .cam-shutter .shutter-camera-icon{
    width:31px;
    height:31px;
    color:#08130C;
    pointer-events:none;
  }
  .cam-shutter .shutter-camera-icon .lens{
    fill:currentColor;
    stroke:none;
  }
  .orientation-hint{
    position:absolute;
    top:20px;
    left:20px;
    right:78px;
    display:none;
    padding:8px 11px;
    border-radius:8px;
    background:rgba(0,0,0,.52);
    color:#fff;
    font:500 12px/1.3 'Inter',sans-serif;
    text-align:center;
    pointer-events:none;
  }
  .camera-overlay.orientation-warning .orientation-hint{ display:block; }


  .key-row{
    margin-top: 22px;
  }
  .key-row input{
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--text);
  }
  .key-row input::placeholder{ color: var(--muted); }
  .key-row input:focus{ border-color: var(--accent-dim); }

  /* ---------- buttons ---------- */
  .btn{
    appearance:none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: -0.005em;
    cursor:pointer;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition: transform .08s ease, border-color .15s ease, background .15s ease;
  }
  .btn:hover{ border-color: var(--accent-dim); }
  .btn:active{ transform: scale(0.98); }
  .btn.primary{
    background: var(--accent);
    color: #08130C;
    border-color: var(--accent);
  }
  .btn.primary:hover{ background: #85ffb2; }
  .btn.warm{
    background: var(--accent-warm);
    color: #2A1200;
    border-color: var(--accent-warm);
  }
  .btn.warm:hover{ background: #ffad6b; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn svg{ width:15px; height:15px; }

  /* ---------- status / progress ---------- */
  /* status updates are announced to screen readers only — nothing shown visually on the page */
  #status{
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
  }

  /* ---------- workspace ---------- */
  #workspace{
    display:none;
    margin-top: 64px;
    border-top: 1px solid var(--line);
    padding-top: 40px;
  }
  #workspace.active{ display:block; }

  .toolbar{
    scroll-margin-top: 16px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .toolbar .group{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

  /* Scan a different image sits on its own row below Select all / Clear selection */
  #rescanBtn{
    flex:1 1 100%;
    justify-content:center;
    margin-top:8px;
  }
  .toolbar-actions{ justify-content:flex-start; }
  /* Select all text + Clear selection: equal width, splitting the row */
  #selectAllBtn, #clearBtn{
    flex:1 1 calc(50% - 5px);
    justify-content:center;
    text-align:center;
  }
  .word-count{
    font-size: 0.85rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .word-count b{ color: var(--text); }

  .workspace-grid{
    display:grid;
    grid-template-columns: 1fr;
    gap: 20px;
    align-items:start;
  }

  .image-pane{
    position:relative;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    overflow:hidden;
    line-height:0;
  }
  .image-stage{
    position:relative;
    display:inline-block;
    user-select:none;
    touch-action: none;
  }
  .image-stage img{
    display:block;
    width:100%;
    height:auto;
  }
  .word-box{
    position:absolute;
    border-radius: 2px;
    background: rgba(111,255,160,0.0);
    outline: 1px solid rgba(111,255,160,0.28);
    cursor: text;
    transition: background .1s ease;
  }
  .word-box:hover{ background: rgba(111,255,160,0.16); }
  .word-box.selected{
    background: rgba(111,255,160,0.38);
    outline: 1px solid var(--accent);
  }

  .output-pane{
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    display:flex;
    flex-direction:column;
    min-height: 320px;
  }
  .output-head{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .output-head span{
    font-size: 0.78rem;
    color: var(--muted);
    text-transform: none;
  }
  #outputText{
    flex:1;
    margin:0;
    padding: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.86rem;
    line-height: 1.6;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    overflow-y:auto;
    max-height: 460px;
  }
  #outputText:empty::before{
    content: "Selected words will appear here, in reading order.";
    color: var(--muted);
  }
  .copied-flag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--accent);
    color: #08130C;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    opacity:0;
    transform: scale(.85);
    pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .copied-flag svg{ width:14px; height:14px; flex:none; }
  .copied-flag.show{ opacity:1; transform: scale(1); }


  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    .copied-flag{ transition:none; }
  }
</style>
</head>
<body>

<div class="shell">

  <section class="hero">
    <div class="hero-center">
      <div class="viewfinder" id="dropZone" tabindex="0" role="button" aria-label="Capture or upload an image to scan">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>

        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
          <path d="M4 8V6a2 2 0 0 1 2-2h2M20 8V6a2 2 0 0 0-2-2h-2M4 16v2a2 2 0 0 0 2 2h2M20 16v2a2 2 0 0 1-2 2h-2"/>
          <rect x="8.5" y="8.5" width="7" height="7" rx="1"/>
        </svg>

        <div class="upload-actions">
          <button type="button" class="btn primary" id="cameraBtn">Use camera</button>
        </div>
      </div>
      <input type="file" id="fileInput" accept="image/*">
      <input type="file" id="cameraInput" accept="image/*" capture="environment">

      <div class="camera-overlay" id="cameraOverlay" role="dialog" aria-label="Camera">
        <video id="cameraVideo" autoplay playsinline muted></video>
        <div class="orientation-hint" id="orientationHint">Rotate your device normally for an upright photo.</div>
        <div class="cam-mode-label" id="camModeLabel" aria-live="polite">
          <svg id="camModeLabelIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="2" y="7" width="20" height="10" rx="2"/>
            <line x1="19" y1="10" x2="19" y2="14"/>
          </svg>
          <span class="mode-label-text" id="camModeLabelText">Landscape (Left)</span>
        </div>
        <button type="button" class="cam-close" id="camCloseBtn" aria-label="Close camera">✕</button>
        <button type="button" class="cam-shutter" id="camShutterBtn" aria-label="Capture photo"></button>
        <button type="button" class="cam-mode-btn" id="camModeBtn" aria-label="Switch to portrait mode (no rotation)" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="7" y="2" width="10" height="20" rx="2"/>
            <line x1="10" y1="19" x2="14" y2="19"/>
          </svg>
        </button>
      </div>

      <div class="key-row">
        <input type="password" id="apiKeyInput" placeholder="Google Cloud Vision API key (optional)" autocomplete="off" value="AIzaSyCZOpqGzFWUhgd8YlHTdj72R7qDuKJ7WoA">
      </div>

      <div id="status" aria-live="polite"></div>
    </div>
  </section>

  <section id="workspace">
    <div class="workspace-grid">
      <div class="image-pane">
        <div class="image-stage" id="imageStage">
          <img id="stageImg" alt="Uploaded image with detected text">
        </div>
      </div>

      <div class="toolbar">
        <div class="group toolbar-actions">
          <button type="button" class="btn warm" id="selectAllBtn">Select all text</button>
          <button type="button" class="btn" id="clearBtn">Clear selection</button>
          <button type="button" class="btn primary" id="rescanBtn">Scan a different image</button>
        </div>
        <div class="group">
          <span class="word-count" id="wordCount"><b>0</b> of <b>0</b> words selected</span>
        </div>
      </div>

      <div class="output-pane">
        <div class="output-head">
          <span>Extracted text</span>
          <div style="display:flex; align-items:center; gap:12px;">
            <span class="copied-flag" id="copiedFlag" role="status" aria-live="polite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Copied to clipboard</span>
            <button type="button" class="btn" id="copyBtn">Copy</button>
          </div>
        </div>
        <pre id="outputText"></pre>
      </div>
    </div>
  </section>

</div>

<script>
(function(){
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const cameraInput = document.getElementById('cameraInput');
  const cameraBtn = document.getElementById('cameraBtn');
  const cameraOverlay = document.getElementById('cameraOverlay');
  const cameraVideo = document.getElementById('cameraVideo');
  const camCloseBtn = document.getElementById('camCloseBtn');
  const camShutterBtn = document.getElementById('camShutterBtn');
  const camModeBtn = document.getElementById('camModeBtn');
  const camModeLabelText = document.getElementById('camModeLabelText');
  const camModeLabelIcon = document.getElementById('camModeLabelIcon');
  const orientationHint = document.getElementById('orientationHint');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const status = document.getElementById('status');

  const workspace = document.getElementById('workspace');
  const imageStage = document.getElementById('imageStage');
  const stageImg = document.getElementById('stageImg');
  const selectAllBtn = document.getElementById('selectAllBtn');
  const clearBtn = document.getElementById('clearBtn');
  const rescanBtn = document.getElementById('rescanBtn');
  const wordCountEl = document.getElementById('wordCount');
  const outputText = document.getElementById('outputText');
  const copyBtn = document.getElementById('copyBtn');
  const copiedFlag = document.getElementById('copiedFlag');

  let words = [];        // {text, x0,y0,x1,y1, selected, lineIndex}
  let lines = [];         // arrays of word indices, in reading order
  let readingOrder = [];  // flat word-index array in reading order (line by line)
  let wordPos = [];       // wordPos[wordIndex] -> position within readingOrder
  let naturalW = 0, naturalH = 0;
  let boxEls = [];

  // Live in-page camera: opens the device camera as a video feed directly
  // inside this page (getUserMedia), instead of handing off to the phone's
  // separate camera app. That means tapping the shutter here captures a
  // frame and starts scanning immediately — there's no external app, so
  // there's no confirm/retake (✓ / ✕) screen to get past first.
  let cameraStream = null;

  async function openCamera(){
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: false
      });
      cameraVideo.srcObject = cameraStream;
      cameraOverlay.classList.add('active');
      await cameraVideo.play();
      await requestOrientationPermission();
      startOrientationTracking();
      updateOrientationUI();
      setupZoom();
    } catch (err) {
      console.error('Live camera unavailable, falling back to native camera app:', err);
      // older browsers, or camera permission denied — fall back to the
      // OS-level camera capture, which does have its own confirm screen
      cameraInput.click();
    }
  }

  function closeCamera(){
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
      cameraStream = null;
    }
    cameraOverlay.classList.remove('active');
    teardownZoom();
  }

  // --- Pinch-to-zoom: drives the camera hardware itself, not the page ---
  // A pinch gesture here maps directly onto the video track's own "zoom"
  // capability via applyConstraints(), the same optical/hardware zoom the
  // native camera app would use. If the device/browser doesn't expose that
  // capability, it falls back to scaling just the <video> element with a
  // CSS transform (digital zoom on the feed) — either way, the page and
  // its layout never move; only the camera image does.
  let zoomTrack = null, zoomCaps = null, zoomVal = 1, zoomSupported = false;
  let digitalZoom = 1;
  let pinchStartDist = 0, pinchStartZoom = 1;

  // Remember the zoom level across camera sessions (and page reloads), so
  // opening the camera again starts at whatever zoom was last used instead
  // of always resetting to 1x.
  const ZOOM_STORAGE_KEY = 'lensLastZoom';
  function saveZoom(z){
    try { localStorage.setItem(ZOOM_STORAGE_KEY, String(z)); } catch (e) {}
  }
  function loadSavedZoom(){
    try {
      const v = parseFloat(localStorage.getItem(ZOOM_STORAGE_KEY));
      return isFinite(v) && v > 0 ? v : null;
    } catch (e) { return null; }
  }

  function setupZoom(){
    zoomTrack = cameraStream.getVideoTracks()[0];
    zoomCaps = (zoomTrack.getCapabilities && zoomTrack.getCapabilities()) || {};
    zoomSupported = typeof zoomCaps.zoom === 'object' || (zoomCaps.zoom && zoomCaps.zoom.max);
    const saved = loadSavedZoom();
    if (zoomSupported) {
      const settings = zoomTrack.getSettings ? zoomTrack.getSettings() : {};
      const min = zoomCaps.zoom.min, max = zoomCaps.zoom.max;
      zoomVal = saved != null ? Math.min(max, Math.max(min, saved)) : (settings.zoom || min || 1);
      // Re-apply on every open so hardware zoom starts where it left off,
      // not wherever the OS/browser defaults a fresh video track to.
      zoomTrack.applyConstraints({ advanced: [{ zoom: zoomVal }] }).catch(() => {});
    } else {
      digitalZoom = saved != null ? Math.min(4, Math.max(1, saved)) : 1;
      cameraVideo.style.transform = 'scale(' + digitalZoom + ')';
    }
  }

  function teardownZoom(){
    zoomTrack = null; zoomCaps = null; zoomSupported = false;
    zoomVal = 1; digitalZoom = 1;
    cameraVideo.style.transform = '';
  }

  function applyZoom(nextZoom){
    if (zoomSupported) {
      const min = zoomCaps.zoom.min, max = zoomCaps.zoom.max;
      zoomVal = Math.min(max, Math.max(min, nextZoom));
      zoomTrack.applyConstraints({ advanced: [{ zoom: zoomVal }] }).catch(() => {});
      saveZoom(zoomVal);
    } else {
      digitalZoom = Math.min(4, Math.max(1, nextZoom));
      cameraVideo.style.transform = 'scale(' + digitalZoom + ')';
      saveZoom(digitalZoom);
    }
  }

  function pinchDistance(touches){
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);

  cameraVideo.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {

      pinchStartZoom = zoomSupported ? zoomVal : digitalZoom;
    }

    if (e.touches.length === 2 && pinchStartDist > 0) {
      e.preventDefault(); // keep the gesture on the camera, not the page
      const dist = pinchDistance(e.touches);
      const ratio = dist / pinchStartDist;
      applyZoom(pinchStartZoom * ratio);

  });

  // the camera feed (mirrors the trackpad-pinch gesture on a laptop).
  cameraVideo.addEventListener('wheel', (e) => {

  }, { passive: false });

  // object-fit:cover means the on-screen video is already cropped to fill
  // the frame (it hides strips off the top/bottom or sides depending on how
  // the sensor's aspect ratio compares to the screen's). But drawing the raw
  // <video> element to canvas grabs the FULL underlying frame, including
  // those hidden strips — so the captured photo used to show more (extra
  // sky/floor) than what was actually visible on screen while shooting.
  // This works out the exact visible rectangle — the same cover-crop the
  // browser applies visually, further narrowed by any digital zoom — and
  // captures only that region, so the result matches the viewfinder exactly.
  function visibleCaptureRect(){
    const vidW = cameraVideo.videoWidth, vidH = cameraVideo.videoHeight;
    const dispW = cameraVideo.clientWidth, dispH = cameraVideo.clientHeight;
    const videoAspect = vidW / vidH, dispAspect = dispW / dispH;

    let cropW, cropH, cropX, cropY;
    if (videoAspect > dispAspect) {
      // sensor frame is relatively wider than the screen — sides get cropped
      cropH = vidH;
      cropW = vidH * dispAspect;
      cropX = (vidW - cropW) / 2;
      cropY = 0;
    } else {
      // sensor frame is relatively taller than the screen — top/bottom get cropped
      cropW = vidW;
      cropH = vidW / dispAspect;
      cropX = 0;
      cropY = (vidH - cropH) / 2;
    }

    // Digital zoom (CSS-transform fallback path) further magnifies a
    // centered sub-region of that same cropped rect — shrink the capture
    // area to match what's actually shown at that zoom level. Hardware zoom
    // needs no extra step here since the sensor itself already produced a
    // zoomed frame (videoWidth/videoHeight already reflect it).
    const dz = zoomSupported ? 1 : digitalZoom;
    const finalW = cropW / dz, finalH = cropH / dz;
    const finalX = cropX + (cropW - finalW) / 2;
    const finalY = cropY + (cropH - finalH) / 2;

    return { x: finalX, y: finalY, w: finalW, h: finalH };
  }

  // --- Smart orientation detection + auto-rotation ---
  // The UI follows the current device orientation. For capture, we prefer
  // the live DeviceOrientation reading (when available) and fall back to the
  // Screen Orientation API / legacy window.orientation.
  let detectedOrientation = 'portrait-primary';
  let lastDeviceOrientation = null;

  // --- Capture mode: how the captured frame is handed to OCR ---
  // 'landscape' (default): the phone is held landscape-left, so the raw
  //   frame is rotated 90° before OCR reads it left-to-right — this is the
  //   existing behavior.
  // 'portrait': the phone is held upright; the frame is sent to OCR exactly
  //   as captured, with no rotation at all.
  let captureMode = 'landscape';

  // Remember the last-used capture mode across sessions, same as zoom, so
  // the camera opens in whichever orientation (landscape or portrait) was
  // used last time instead of always defaulting to landscape.
  const CAPTURE_MODE_STORAGE_KEY = 'lensLastCaptureMode';
  function saveCaptureMode(mode){
    try { localStorage.setItem(CAPTURE_MODE_STORAGE_KEY, mode); } catch (e) {}
  }
  function loadSavedCaptureMode(){
    try {
      const v = localStorage.getItem(CAPTURE_MODE_STORAGE_KEY);
      return (v === 'portrait' || v === 'landscape') ? v : null;
    } catch (e) { return null; }
  }
  captureMode = loadSavedCaptureMode() || captureMode;

  function updateCaptureModeUI(){
    const isPortrait = captureMode === 'portrait';
    camModeBtn.classList.toggle('active', isPortrait);
    camModeBtn.setAttribute('aria-pressed', isPortrait ? 'true' : 'false');
    camModeBtn.setAttribute('aria-label', isPortrait
      ? 'Switch to landscape mode (rotates before OCR)'
      : 'Switch to portrait mode (no rotation)');
    camModeLabelText.textContent = isPortrait ? 'Portrait' : 'Landscape (Left)';
    // the icon is drawn as a horizontal (landscape) phone outline by
    // default; rotate it 90° to show the vertical (portrait) outline
    // when portrait mode is active
    camModeLabelIcon.style.transform = isPortrait ? 'rotate(90deg)' : 'rotate(0deg)';
  }

  camModeBtn.addEventListener('click', () => {
    captureMode = captureMode === 'portrait' ? 'landscape' : 'portrait';
    saveCaptureMode(captureMode);
    updateCaptureModeUI();
  });

  updateCaptureModeUI();

  // Tap-anywhere-to-capture: any tap on the camera overlay snaps a photo,
  // except taps on the controls that have their own job (close, shutter,
  // portrait/landscape toggle). A pinch-zoom drag shouldn't accidentally
  // trigger this — but a two-finger pinch never produces a "click" event
  // in the first place, so no extra guard is needed for that.
  cameraOverlay.addEventListener('click', (e) => {
    if (!cameraOverlay.classList.contains('active')) return;
    if (e.target.closest('#camCloseBtn, #camShutterBtn, #camModeBtn')) return;
    captureFromCamera();
  });

  function orientationFromAngle(angle){
    const a = ((Number(angle) || 0) % 360 + 360) % 360;
    if (a >= 45 && a < 135) return 'landscape-primary';
    if (a >= 135 && a < 225) return 'portrait-secondary';
    if (a >= 225 && a < 315) return 'landscape-secondary';
    return 'portrait-primary';
  }

  function currentOrientationType(){
    if (detectedOrientation) return detectedOrientation;

    if (screen.orientation && typeof screen.orientation.angle === 'number') {
      return orientationFromAngle(screen.orientation.angle);
    }
    if (screen.orientation && screen.orientation.type) {
      return screen.orientation.type;
    }
    if (typeof window.orientation === 'number') {
      return orientationFromAngle(window.orientation);
    }
    return 'portrait-primary';
  }

  function orientationLabel(type){
    return {
      'portrait-primary': 'Portrait',
      'portrait-secondary': 'Upside down',
      'landscape-primary': 'Landscape',
      'landscape-secondary': 'Landscape'
    }[type] || 'Portrait';
  }

  function orientationAngle(type){
    return {
      'portrait-primary': 0,
      'landscape-primary': 90,
      'portrait-secondary': 180,
      'landscape-secondary': 270
    }[type] || 0;
  }

  function updateOrientationUI(){
    const type = currentOrientationType();
    const angle = orientationAngle(type);

    // Upside-down capture is supported and automatically corrected.
  }

  function classifyDeviceOrientation(e){
    // beta: front/back tilt; gamma: left/right tilt.
    // The sign of gamma tells left vs right landscape. For devices that do not
    // expose a useful gamma, screen orientation remains the fallback.
    if (!e || typeof e.beta !== 'number' || typeof e.gamma !== 'number') return;

    const beta = e.beta;
    const gamma = e.gamma;

    if (Math.abs(gamma) > 45) {
      detectedOrientation = gamma > 0 ? 'landscape-primary' : 'landscape-secondary';
    } else if (Math.abs(beta) > 135) {
      detectedOrientation = 'portrait-secondary';
    } else {
      detectedOrientation = 'portrait-primary';
    }
    lastDeviceOrientation = { beta, gamma };
    updateOrientationUI();
  }

  function syncScreenOrientation(){
    if (screen.orientation && typeof screen.orientation.angle === 'number') {
      // DeviceOrientation is more specific when available, but this keeps the
      // UI correct on browsers that only expose screen orientation.
      if (!lastDeviceOrientation) {
        detectedOrientation = orientationFromAngle(screen.orientation.angle);
      }
    } else if (typeof window.orientation === 'number') {
      detectedOrientation = orientationFromAngle(window.orientation);
    }
    updateOrientationUI();
  }

  let orientationTrackingStarted = false;

  function startOrientationTracking(){
    syncScreenOrientation();
    if (orientationTrackingStarted) {
      updateOrientationUI();
      return;
    }
    orientationTrackingStarted = true;
    window.addEventListener('orientationchange', syncScreenOrientation, { passive:true });
    if (screen.orientation) {
      screen.orientation.addEventListener?.('change', syncScreenOrientation);
    }

    // DeviceOrientation is used when the browser exposes it. Permission is
    // requested only where iOS requires it and only from the camera-open action.
    const needsPermission = typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function';

    const attach = () => {
      window.addEventListener('deviceorientation', classifyDeviceOrientation, { passive:true });
    };

    if (!needsPermission) {
      attach();
    }
  }

  async function requestOrientationPermission(){
    if (typeof DeviceOrientationEvent === 'undefined' ||
        typeof DeviceOrientationEvent.requestPermission !== 'function') return;

    try {
      const permission = await DeviceOrientationEvent.requestPermission();
      if (permission === 'granted') {
        window.addEventListener('deviceorientation', classifyDeviceOrientation, { passive:true });
      }
    } catch (err) {
      console.warn('Device orientation permission unavailable:', err);
    }
  }

  function captureFromCamera(){
    if (!cameraVideo.videoWidth) return;

    const rect = visibleCaptureRect();
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    const sourceW = Math.round(rect.w);
    const sourceH = Math.round(rect.h);

    if (captureMode === 'portrait') {
      // PORTRAIT MODE:
      // Send the frame to OCR exactly as captured — no rotation at all.
      canvas.width = sourceW;
      canvas.height = sourceH;

      ctx.drawImage(
        cameraVideo,
        rect.x, rect.y, sourceW, sourceH,
        0, 0, sourceW, sourceH
      );
    } else {
      // LANDSCAPE-LEFT MODE (default):
      // The app is intended to be used with the phone held landscape-left.
      // Rotate the captured camera frame 90° counter-clockwise so the
      // final OCR image is landscape with normal left-to-right text.
      // A 90° rotation swaps width and height.
      canvas.width = sourceH;
      canvas.height = sourceW;

      ctx.save();
      ctx.translate(0, canvas.height);
      ctx.rotate(-Math.PI / 2);

      ctx.drawImage(
        cameraVideo,
        rect.x, rect.y, sourceW, sourceH,
        0, 0, sourceW, sourceH
      );

      ctx.restore();
    }

    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

    closeCamera();
    runOCR(dataUrl);
  }

  syncScreenOrientation();
  cameraBtn.addEventListener('click', openCamera);

  // Auto-start the camera as soon as the page loads, so there's no need to
  // tap "Use camera" first. The browser will still show its own native
  // permission prompt the first time (that's a browser security control,
  // not something a site can skip) — after it's allowed once, future visits
  // will open the camera immediately with no extra tap at all.
  openCamera();
  dropZone.addEventListener('click', (e) => {
    if (e.target === cameraBtn) return;
    openCamera();
  });
  dropZone.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCamera(); }
  });
  camShutterBtn.addEventListener('click', captureFromCamera);
  camCloseBtn.addEventListener('click', closeCamera);

  // IMPORTANT LIMITATION: mobile browsers do not forward hardware volume
  // button presses to web pages — the OS intercepts them to change the
  // device volume, by design, for security/consistency reasons. This
  // listener will only ever fire in contexts that DO expose the keys
  // (e.g. a desktop/laptop keyboard's volume keys, or a native WebView
  // wrapper that explicitly forwards them, such as a Capacitor/Cordova
  // app). On a normal phone browser tab, pressing volume up/down will
  // just change the ringer/media volume as usual and this code will not
  // run. Wiring it up here so it works automatically wherever the
  // platform does support it.
  window.addEventListener('keydown', (e) => {
    if (!cameraOverlay.classList.contains('active')) return;
    if (e.key === 'AudioVolumeUp' || e.key === 'AudioVolumeDown') {
      e.preventDefault();
      captureFromCamera();
    }
  });

  // drag-and-drop of an existing image file is still supported quietly,
  // even though the visible action is "Use camera"
  fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });
  cameraInput.addEventListener('change', () => { if (cameraInput.files[0]) handleFile(cameraInput.files[0]); });

  ['dragenter','dragover'].forEach(evt => {
    dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  });
  ['dragleave','drop'].forEach(evt => {
    dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.remove('drag-over'); });
  });

    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) handleFile(f);
  });

  function setStatus(msg){ status.textContent = msg; }

  function handleFile(file){
    const reader = new FileReader();
    reader.onload = (e) => runOCR(e.target.result);
    reader.readAsDataURL(file);
  }

  // Upscales small images and boosts contrast before handing the frame to
  // Tesseract — this is what actually moves accuracy, especially for
  // photos of a monitor (low contrast, glare) or a printed page (uneven
  // lighting). Returns a <canvas> ready to pass straight into recognize().
  // Advanced preprocessing pipeline: upscale small/blurry captures, convert
  // to grayscale, stretch contrast to the full range, then sharpen edges so
  // thin character strokes and small symbols (punctuation, currency signs,
  // etc.) stay crisp for the OCR engine. This is what actually drives
  // accuracy — especially on monitor photos (low contrast, glare) and
  // printed pages (uneven lighting).
  function sizedCanvas(img, maxWidth){
    const minWidth = 1400;
    let scale = 1;
    if (img.naturalWidth < minWidth) scale = Math.min(2, minWidth / img.naturalWidth);
    else if (img.naturalWidth > maxWidth) scale = maxWidth / img.naturalWidth;
    const w = Math.round(img.naturalWidth * scale);
    const h = Math.round(img.naturalHeight * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, w, h);
    return canvas;
  }

  // Grayscale + gentle, histogram-based contrast normalization and a light
  // unsharp mask. Clipping to the 2nd/98th percentile (rather than the
  // absolute min/max) and blending the sharpen in at partial strength keeps
  // this from over-processing already-crisp text (screenshots, clean
  // photos) — which was previously shattering small glyphs into noise.
  function enhance(sourceCanvas){
    const w = sourceCanvas.width, h = sourceCanvas.height;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(sourceCanvas, 0, 0);
    const imgData = ctx.getImageData(0, 0, w, h);
    const d = imgData.data;

    const gray = new Float32Array(w * h);
    const hist = new Uint32Array(256);
    for (let i = 0, p = 0; i < d.length; i += 4, p++) {
      const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      gray[p] = g;
      hist[Math.round(g)]++;
    }

    const total = w * h, tailTarget = total * 0.02;
    let acc = 0, lo = 0, hi = 255;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= tailTarget) { lo = v; break; } }
    acc = 0;
    for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= tailTarget) { hi = v; break; } }
    const range = Math.max(hi - lo, 1);

    const stretched = new Float32Array(w * h);
    for (let p = 0; p < gray.length; p++) {
      stretched[p] = Math.min(255, Math.max(0, (gray[p] - lo) * (255 / range)));
    }

    const amount = 0.35; // partial-strength sharpen, not a full kernel
    const out = new Uint8ClampedArray(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const idx = y * w + x;
        if (x === 0 || y === 0 || x === w - 1 || y === h - 1) { out[idx] = stretched[idx]; continue; }
        const center = stretched[idx];
        const nbAvg = (stretched[idx - w] + stretched[idx + w] + stretched[idx - 1] + stretched[idx + 1]) / 4;
        out[idx] = center + amount * (center - nbAvg);
      }
    }

    for (let i = 0, p = 0; i < d.length; i += 4, p++) {
      const v = out[p];
      d[i] = d[i + 1] = d[i + 2] = v;
    }
    ctx.putImageData(imgData, 0, 0);
    return canvas;
  }

  // Screens are frequently light text on a dark background (dark-mode
  // apps, code editors, terminals). OCR models are trained overwhelmingly
  // on dark text on light paper, so an inverted copy is tried too.
  function invertCanvas(sourceCanvas){
    const canvas = document.createElement('canvas');
    canvas.width = sourceCanvas.width;
    canvas.height = sourceCanvas.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(sourceCanvas, 0, 0);
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      d[i] = 255 - d[i]; d[i + 1] = 255 - d[i + 1]; d[i + 2] = 255 - d[i + 2];
    }
    ctx.putImageData(imgData, 0, 0);
    return canvas;
  }

  // A persistent Tesseract worker, created once and reused for every scan.
  // The static Tesseract.recognize() call spins up a brand-new worker
  // (loading the WASM engine + language data) on every single invocation —
  // that startup cost, not the actual OCR, was most of what made repeat
  // local scans feel slow. Warming this up as soon as the page loads means
  // it's usually already ready by the time a photo is captured.
  let workerPromise = null;
  function getWorker(){
    if (!workerPromise) workerPromise = Tesseract.createWorker('eng');
    return workerPromise;
  }
  getWorker(); // fire-and-forget warm-up, doesn't block anything

  // Runs local OCR. Tries a single fast pass first, at a smaller working
  // resolution, on the pre-warmed worker; only escalates to the slower
  // raw+inverted comparison if that pass came back weak or empty (e.g.
  // light-on-dark screens) — so the common case pays for one quick pass,
  // not three.
  async function recognizeBest(img){
    const worker = await getWorker();

    const rescale = (canvas, result) => {
      const scaleX = img.naturalWidth / canvas.width;
      const scaleY = img.naturalHeight / canvas.height;
      return {
        data: {
          words: (result.data.words || []).map(w => ({
            text: w.text,
            bbox: {
              x0: w.bbox.x0 * scaleX, y0: w.bbox.y0 * scaleY,
              x1: w.bbox.x1 * scaleX, y1: w.bbox.y1 * scaleY
            }
          }))
        }
      };
    };

    const fastCanvas = sizedCanvas(img, 1600);
    const fastEnhanced = enhance(fastCanvas);
    const fast = await worker.recognize(fastEnhanced);
    if (fast.data.words && fast.data.words.length && fast.data.confidence > 40) {
      return rescale(fastCanvas, fast);
    }

    // weak/empty result — try a slightly larger raw pass and an inverted
    // copy, on the same worker (so still just one engine, no extra
    // startup), and keep whichever candidate scored highest
    const raw = sizedCanvas(img, 2200);
    const enhanced = enhance(raw);
    const inverted = invertCanvas(enhanced);
    const rawResult = await worker.recognize(raw);
    const invResult = await worker.recognize(inverted);

    const candidates = [
      { canvas: fastCanvas, result: fast },
      { canvas: raw, result: rawResult },
      { canvas: raw, result: invResult }
    ];
    const score = (c) => (c.result.data.words && c.result.data.words.length) ? c.result.data.confidence : -1;
    const best = candidates.reduce((a, c) => (score(c) > score(a) ? c : a));
    return rescale(best.canvas, best.result);
  }

  // Optional cloud OCR path. The key lives only in this JS variable for the
  // current tab — it is never written into this file, never sent anywhere
  // but Google's API, and never stored via localStorage/sessionStorage.
  // If left blank, everything falls back to the free local engine above.
  let visionApiKey = apiKeyInput.value.trim();
  apiKeyInput.addEventListener('input', () => { visionApiKey = apiKeyInput.value.trim(); });

  // Downscaling before upload (most phone photos are far bigger than OCR
  // needs) and switching to compressed JPEG cuts the request payload
  // drastically, which is most of what makes the cloud pass feel slow on
  // a phone connection. Bounding boxes are rescaled back to the original
  // photo's resolution afterward so the overlay still lines up.
  async function recognizeWithVision(img){
    const maxDim = 2000;
    const longest = Math.max(img.naturalWidth, img.naturalHeight);
    const scale = longest > maxDim ? maxDim / longest : 1;
    const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, w, h);
    const base64 = canvas.toDataURL('image/jpeg', 0.88).split(',')[1];
    const scaleX = img.naturalWidth / w, scaleY = img.naturalHeight / h;

    const res = await fetch('https://vision.googleapis.com/v1/images:annotate?key=' + encodeURIComponent(visionApiKey), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        requests: [{
          image: { content: base64 },
          features: [{ type: 'DOCUMENT_TEXT_DETECTION' }],
          imageContext: { languageHints: ['en'] }
        }]
      })
    });
    if (!res.ok) throw new Error('Vision API request failed (' + res.status + ')');
    const json = await res.json();
    const resp = json.responses && json.responses[0];
    if (resp && resp.error) throw new Error(resp.error.message || 'Vision API error');
    const annotation = resp && resp.fullTextAnnotation;
    if (!annotation || !annotation.pages) return [];

    const rawWords = [];
    annotation.pages.forEach(page => {
      (page.blocks || []).forEach(block => {
        (block.paragraphs || []).forEach(para => {
          (para.words || []).forEach(word => {
            const text = (word.symbols || []).map(s => s.text).join('');
            const verts = (word.boundingBox && word.boundingBox.vertices) || [];
            const xs = verts.map(v => (v.x || 0) * scaleX);
            const ys = verts.map(v => (v.y || 0) * scaleY);
            if (!text || !xs.length) return;
            rawWords.push({ text, bbox: { x0: Math.min(...xs), y0: Math.min(...ys), x1: Math.max(...xs), y1: Math.max(...ys) } });
          });
        });
      });
    });
    return rawWords;
  }

  async function runOCR(dataUrl){
    // Keep whatever is currently on screen (image, word boxes, extracted
    // text) showing while the new scan runs, instead of wiping it first —
    // that way there's no empty flash and, since the workspace section was
    // already visible, no scroll jump either. Only replace it once the new
    // result actually comes back.
    const hadPreviousResult = words.length > 0;
    const wasAlreadyOpen = workspace.classList.contains('active');
    const savedScrollY = window.scrollY;
    // on a rescan the page must not move at all, even if the new image has
    // a different height — put the page back exactly where it was
    const holdPage = () => { if (wasAlreadyOpen) window.scrollTo({ top: savedScrollY, left: 0, behavior: 'instant' }); };
    workspace.classList.add('active');
    setButtonsEnabled(false);
    setStatus('Reading the text…');

    try {
      const sourceImg = await loadImage(dataUrl);

      let rawWords;
      if (visionApiKey) {
        try {
          rawWords = await recognizeWithVision(sourceImg);
        } catch (err) {
          console.error('Vision API failed, falling back to local OCR:', err);
          setStatus('Cloud OCR unavailable (' + err.message + ') — using built-in OCR instead…');
          rawWords = (await recognizeBest(sourceImg)).data.words || [];
        }
      } else {
        rawWords = (await recognizeBest(sourceImg)).data.words || [];
      }

      if (rawWords.length === 0) {
        setButtonsEnabled(true);
        setStatus(hadPreviousResult
          ? 'No text was detected in that image — keeping the previous scan. Try better lighting or holding the camera steadier.'
          : 'No text was detected in that image. Try better lighting or holding the camera steadier.');
        return;
      }

      buildWords(rawWords);

      // text is ready — select it and copy it immediately, without waiting
      // on the image overlay to render, so copy is available the instant
      // recognition finishes
      selectAll();
      setButtonsEnabled(true);
      setStatus('Found ' + words.length + ' word' + (words.length === 1 ? '' : 's') + ' — all selected and copied.');
      // Only scroll down to the results the very first time the workspace
      // appears. On a rescan the workspace is already in view, so jumping
      // the page again would just be an unnecessary, disorienting scroll.
      autoCopy();

      // overlay boxes on the full-resolution image render afterward — purely
      // visual, so it never blocks the text/copy from being ready first
      stageImg.onload = () => {
        placeStage(); layoutBoxes();
        if (!wasAlreadyOpen) {
          // first scan only: once the image has its final size (so nothing
          // shifts afterward), take the user straight to the Select all
          // text / Clear selection / Scan a different image buttons
          document.querySelector('.toolbar').scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
          holdPage();
        }
      };
      stageImg.src = dataUrl;
    } catch (err) {
      console.error(err);
      setButtonsEnabled(true);
      setStatus('Something went wrong reading that image. Please try another one.');
    }
  }

  function loadImage(dataUrl){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = dataUrl;
    });
  }

  function setButtonsEnabled(enabled){
    [selectAllBtn, clearBtn, copyBtn].forEach(b => b.disabled = !enabled);
  }

  // Copied label: stays visible until the extracted text changes.
  function markCopied(){ copiedFlag.classList.add('show'); }
  function clearCopied(){ copiedFlag.classList.remove('show'); }

  async function autoCopy(){
    try {
      await navigator.clipboard.writeText(outputText.textContent);
      markCopied();
    } catch (e) {
      // Clipboard permission can be blocked silently by the browser —
      // the text is already selected and visible, so a manual tap on
      // Copy still works.
    }
  }

  function buildWords(rawWords){
    const clean = rawWords
      .filter(w => w.text && w.text.trim().length > 0)
      .map(w => ({
        text: w.text,
        x0: w.bbox.x0, y0: w.bbox.y0, x1: w.bbox.x1, y1: w.bbox.y1,
        selected: false
      }));

    clean.sort((a, b) => (a.y0 - b.y0) || (a.x0 - b.x0));

    const avgH = clean.reduce((s, w) => s + (w.y1 - w.y0), 0) / (clean.length || 1);
    const lineThreshold = Math.max(avgH * 0.6, 6);

    lines = [];
    clean.forEach((w, i) => {
      const cy = (w.y0 + w.y1) / 2;
      let line = lines.find(l => Math.abs(l.cy - cy) < lineThreshold);
      if (!line) {
        line = { cy, indices: [] };
        lines.push(line);
      } else {
        line.cy = (line.cy * line.indices.length + cy) / (line.indices.length + 1);
      }
      line.indices.push(i);
    });

    lines.forEach(l => l.indices.sort((a, b) => clean[a].x0 - clean[b].x0));
    lines.sort((a, b) => a.cy - b.cy);

    words = clean;

    // flat reading order (line by line, left to right) — used to turn a
    // drag start/end pair into a continuous text range, the way selecting
    // text in a normal document works
    readingOrder = [];
    lines.forEach(l => l.indices.forEach(idx => readingOrder.push(idx)));
    wordPos = new Array(words.length);
    readingOrder.forEach((idx, pos) => { wordPos[idx] = pos; });
  }

  function placeStage(){
    naturalW = stageImg.naturalWidth;
    naturalH = stageImg.naturalHeight;
  }

  function layoutBoxes(){
    boxEls.forEach(el => el.remove());
    boxEls = [];
    const rect = stageImg.getBoundingClientRect();
    const scale = rect.width / naturalW;

    words.forEach((w, i) => {
      const el = document.createElement('div');
      el.className = 'word-box' + (w.selected ? ' selected' : '');
      el.style.left = (w.x0 * scale) + 'px';
      el.style.top = (w.y0 * scale) + 'px';
      el.style.width = ((w.x1 - w.x0) * scale) + 'px';
      el.style.height = ((w.y1 - w.y0) * scale) + 'px';
      el.dataset.index = i;
      el.title = w.text;
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        if (suppressClick) { return; }
        w.selected = !w.selected;
        el.classList.toggle('selected', w.selected);
        refreshOutput();
      });
      imageStage.appendChild(el);
      boxEls.push(el);
    });
  }

  window.addEventListener('resize', () => { if (words.length) layoutBoxes(); });

  function selectAll(){
    words.forEach((w, i) => { w.selected = true; boxEls[i] && boxEls[i].classList.add('selected'); });
    refreshOutput();
  }
  function clearAll(){
    words.forEach((w, i) => { w.selected = false; boxEls[i] && boxEls[i].classList.remove('selected'); });
    refreshOutput();
  }
  selectAllBtn.addEventListener('click', selectAll);
  clearBtn.addEventListener('click', clearAll);

  rescanBtn.addEventListener('click', () => {
    // Stay right where we are — the current image, word boxes, and
    // extracted text keep showing underneath while the camera overlay opens
    // on top. No hiding the workspace and no scrolling back up, so there's
    // no jarring back-and-forth once the new scan finishes.
    openCamera();
  });

  function refreshOutput(){
    const selectedCount = words.filter(w => w.selected).length;
    wordCountEl.innerHTML = '<b>' + selectedCount + '</b> of <b>' + words.length + '</b> words selected';

    const out = [];
    lines.forEach(line => {
      const picked = line.indices.filter(i => words[i].selected).map(i => words[i].text);
      if (picked.length) out.push(picked.join(' '));
    });
    outputText.textContent = out.join('\n');
    clearCopied();
  }

  // Drag-to-select: press down on a starting word, drag toward an end
  // point, and the whole span between them in reading order gets selected
  // — the rest of the start line, every full line in between, then the
  // start of the end line — exactly like dragging to select text in a
  // normal document. This replaces whatever was selected before, so
  // dragging over an already-selected image narrows it down to just the
  // dragged range. A plain tap still toggles a single word on its own; a
  // suppressClick flag stops that tap-toggle from firing right after a
  // drag (which would otherwise instantly undo the word just selected).
  let dragging = false, dragMoved = false, suppressClick = false;
  let startX = 0, startY = 0, cachedRects = [], dragStartIndex = -1;
  const DRAG_THRESHOLD = 6;

  function nearestWordIndex(clientX, clientY){
    let bestIdx = -1, bestDist = Infinity;
    for (let i = 0; i < cachedRects.length; i++) {
      const r = cachedRects[i];
      const dx = clientX < r.left ? r.left - clientX : (clientX > r.right ? clientX - r.right : 0);
      const dy = clientY < r.top ? r.top - clientY : (clientY > r.bottom ? clientY - r.bottom : 0);
      const dist = dx * dx + dy * dy;
      if (dist < bestDist) { bestDist = dist; bestIdx = i; }
    }
    return bestIdx;
  }

  function applyRange(posA, posB){
    const lo = Math.min(posA, posB), hi = Math.max(posA, posB);
    let changed = false;
    for (let i = 0; i < words.length; i++) {
      const sel = wordPos[i] >= lo && wordPos[i] <= hi;
      if (words[i].selected !== sel) {
        words[i].selected = sel;
        boxEls[i].classList.toggle('selected', sel);
        changed = true;
      }
    }
    if (changed) refreshOutput();
  }

  function beginDrag(clientX, clientY){
    if (!words.length) return;
    dragging = true; dragMoved = false;
    startX = clientX; startY = clientY;
    cachedRects = boxEls.map(el => el.getBoundingClientRect());
    dragStartIndex = nearestWordIndex(clientX, clientY);
  }
  function moveDrag(clientX, clientY){
    if (!dragging) return;
    if (!dragMoved && Math.hypot(clientX - startX, clientY - startY) > DRAG_THRESHOLD) {
      dragMoved = true;
    }
    if (dragMoved && dragStartIndex !== -1) {
      const currentIndex = nearestWordIndex(clientX, clientY);
      if (currentIndex !== -1) applyRange(wordPos[dragStartIndex], wordPos[currentIndex]);
    }
  }
  function endDrag(){
    if (dragMoved) {
      suppressClick = true;
      setTimeout(() => { suppressClick = false; }, 0);
    }
    dragging = false; dragMoved = false;
  }

  imageStage.addEventListener('mousedown', (e) => beginDrag(e.clientX, e.clientY));
  window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
  window.addEventListener('mouseup', endDrag);

  imageStage.addEventListener('touchstart', (e) => {
    const t = e.touches[0]; beginDrag(t.clientX, t.clientY);
  }, { passive: true });
  imageStage.addEventListener('touchmove', (e) => {
    if (dragging) {
      const t = e.touches[0];
      moveDrag(t.clientX, t.clientY);
      if (dragMoved) e.preventDefault(); // stop page scroll once it's clearly a select-drag
    }
  }, { passive: false });
  imageStage.addEventListener('touchend', (e) => {
    if (dragMoved) e.preventDefault(); // suppress the synthetic click that follows touchend
    endDrag();
  });

  // copy
  copyBtn.addEventListener('click', async () => {
    const text = outputText.textContent;
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    markCopied();
  });
})();
</script>

</body>
</html>
